services:
  - type: web
    name: steam-guard-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: IMAP_TIMEOUT
        value: "5"
      - key: CODE_POLL_INTERVAL
        value: "2"
      - key: CODE_POLL_TIMEOUT
        value: "15"
      - key: RATE_LIMIT
        value: "60/minute"
      - key: TOKEN_DEFAULT_EXPIRATION
        value: "3600"
      - key: REDIS_URL
        sync: false
